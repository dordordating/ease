<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ease</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="workspace.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="topbar">
        <div class="brand">
          <img src="icons/logo.svg" width="36" height="36" alt="">
          <div><div class="brand-name">Ease</div><small class="tagline" id="workspace-label"></small></div>
        </div>
        <div class="header-actions">
          <button id="panel-button" class="icon-button" type="button"></button>
          <button id="settings-button" class="icon-button" type="button"></button>
        </div>
      </div>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input type="search" id="search" autocomplete="off" spellcheck="false" aria-controls="workspace">
        <kbd class="keycap" aria-hidden="true">/</kbd>
      </div>
      <nav class="module-tabs" id="module-tabs"></nav>
    </header>
    <main class="workspace" id="workspace" tabindex="-1"></main>
    <footer class="workspace-footer" id="workspace-footer"></footer>
  </div>
  <dialog class="editor-dialog" id="editor"></dialog>
  <div class="toast" id="toast" hidden>
    <span id="toast-message" role="status" aria-live="polite"></span>
    <button class="toast-action" id="toast-action" type="button" hidden></button>
  </div>
</body>
</html>
