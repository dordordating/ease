services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-ease}
      - PGUSER=${POSTGRES_USER:-ease}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS:?Set GOOGLE_CLIENT_IDS}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      - OPENROUTER_MODEL_ECONOMY
      - OPENROUTER_MODEL_STANDARD
      - OPENROUTER_MODEL_PREMIUM
      - OPENROUTER_MODEL_ASSISTANT
      - OPENROUTER_MODEL_ASSISTANT_FALLBACK
      - USER_DAILY_LIMIT
      - GLOBAL_DAILY_LIMIT
      - SESSION_TTL_MINUTES
      - MAX_TRANSLATION_CHARACTERS
      - MAX_OUTPUT_TOKENS
      - MAX_CONCURRENT_TRANSLATIONS
      - COINGECKO_DEMO_API_KEY
      - MAIL_OAUTH_ORIGIN
      - MAIL_EXTENSION_IDS
      - MAIL_GOOGLE_CLIENT_ID
      - MAIL_GOOGLE_CLIENT_SECRET
      - MAIL_MICROSOFT_CLIENT_ID
      - MAIL_MICROSOFT_CLIENT_SECRET
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen("http://127.0.0.1:8000/healthz", timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ease}
      POSTGRES_USER: ${POSTGRES_USER:-ease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=96MB
      - -c
      - max_connections=20
      - -c
      - max_parallel_workers_per_gather=0
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
